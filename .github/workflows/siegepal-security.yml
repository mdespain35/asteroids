name: SiegePal Security
on:
  workflow_dispatch:
    inputs:
      semgrep:
        description: "Run Semgrep"
        type: boolean
        default: true
      checkov:
        description: "Run Checkov"
        type: boolean
        default: true
      bandit:
        description: "Run Bandit"
        type: boolean
        default: true
      snyk:
        description: "Run Snyk (SCA)"
        type: boolean
        default: true
      trivy:
        description: "Run Trivy"
        type: boolean
        default: true
      snyk_code:
        description: "Run Snyk Code"
        type: boolean
        default: true
      snyk_iac:
        description: "Run Snyk IaC"
        type: boolean
        default: true
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
jobs:
  semgrep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.semgrep == true || inputs.semgrep == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install --disable-pip-version-check --no-cache-dir semgrep
      - name: Run Semgrep
        id: scan
        continue-on-error: true
        run: semgrep --config auto --sarif --output semgrep.sarif .
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siegepal-semgrep-results
          path: semgrep.sarif
      - name: SiegePal gate — evaluate findings
        id: siegepal_gate
        if: always()
        env:
          SIEGEPAL_GATE_SEVERITY: "high"
          SIEGEPAL_SARIF_FILE: "semgrep.sarif"
        run: |
          python3 - <<'PYEOF'
          import json, os
          order = ["none", "low", "medium", "high", "critical"]
          threshold = os.environ.get("SIEGEPAL_GATE_SEVERITY", "none").lower()
          sarif_file = os.environ.get("SIEGEPAL_SARIF_FILE", "")
          out = os.environ.get("GITHUB_OUTPUT")
          def emit(**kw):
              with open(out, "a") as fh:
                  for k, v in kw.items():
                      fh.write("%s=%s\n" % (k, v))
          def sev_from_result(r, rules):
              props = r.get("properties") or {}
              sc = props.get("security-severity")
              if sc is None:
                  rid = r.get("ruleId")
                  rule = rules.get(rid, {})
                  sc = ((rule.get("properties") or {}).get("security-severity"))
              if sc is not None:
                  try:
                      f = float(sc)
                  except (TypeError, ValueError):
                      f = -1
                  if f >= 9.0: return 4
                  if f >= 7.0: return 3
                  if f >= 4.0: return 2
                  if f > 0.0: return 1
              level = (r.get("level") or "").lower()
              return {"error": 3, "warning": 2, "note": 1, "none": 0}.get(level, 2)
          # A parseable SARIF file is the authoritative 'the scanner ran'
          # signal — most scanners exit non-zero when they FIND issues,
          # so the tool's exit code must NOT gate this (that would flag
          # every findings-present scan as an inconclusive crash).
          if not os.path.exists(sarif_file):
              # Missing output file is never "zero findings" (R5.5).
              emit(conclusion="neutral", findings="0",
                   summary="Tool did not produce an output file; result is inconclusive.")
              raise SystemExit(0)
          try:
              with open(sarif_file) as fh:
                  doc = json.load(fh)
          except Exception as exc:
              emit(conclusion="neutral", findings="0",
                   summary="Could not parse scanner output: %s" % exc)
              raise SystemExit(0)
          t = order.index(threshold) if threshold in order else 0
          count = 0
          for run in (doc.get("runs") or []):
              rules = {}
              for rule in (((run.get("tool") or {}).get("driver") or {}).get("rules") or []):
                  if rule.get("id"): rules[rule["id"]] = rule
              for res in (run.get("results") or []):
                  if sev_from_result(res, rules) >= t:
                      count += 1
          if count > 0:
              emit(conclusion="failure", findings=str(count),
                   summary="%d finding(s) at or above %s severity." % (count, threshold))
          else:
              emit(conclusion="success", findings="0",
                   summary="No findings at or above %s severity." % threshold)
          PYEOF
      - name: SiegePal gate — report check run
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SIEGEPAL_CHECK_CONCLUSION: "${{ steps.siegepal_gate.outputs.conclusion }}"
          SIEGEPAL_CHECK_SUMMARY: "${{ steps.siegepal_gate.outputs.summary }}"
          SIEGEPAL_HEAD_SHA: ""
        with:
          script: |
            if (context.payload.pull_request && context.payload.pull_request.head.repo.fork) {
              core.info("Fork PR: GITHUB_TOKEN is read-only, skipping check run creation.");
              return;
            }
            const conclusion = process.env.SIEGEPAL_CHECK_CONCLUSION || "neutral";
            const advisory = 'This result is advisory. To block merges, mark this check ("SiegePal / Semgrep") as a required status check in Settings → Branches → Branch protection rules.';
            const summary = (process.env.SIEGEPAL_CHECK_SUMMARY || "") + "\n\n" + advisory;
            const headSha = process.env.SIEGEPAL_HEAD_SHA || (context.payload.pull_request && context.payload.pull_request.head.sha) || context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'SiegePal / Semgrep',
              head_sha: headSha,
              status: "completed",
              conclusion: conclusion,
              output: { title: 'SiegePal / Semgrep', summary: summary },
            });
      - name: SiegePal gate — enforce
        if: always()
        env:
          SIEGEPAL_CHECK_CONCLUSION: "${{ steps.siegepal_gate.outputs.conclusion }}"
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "Fork PR: findings uploaded as artifacts; not failing the workflow."
            exit 0
          fi
          if [ "$SIEGEPAL_CHECK_CONCLUSION" = "failure" ]; then
            echo "SiegePal gate: blocking findings present."
            exit 1
          fi
          if [ "$SIEGEPAL_CHECK_CONCLUSION" = "neutral" ]; then
            echo "SiegePal gate: scanner result inconclusive (tool crash or missing output)."
            exit 1
          fi
          echo "SiegePal gate: passed."
      - name: Notify SiegePal
        continue-on-error: true
        env:
          SIEGEPAL_CALLBACK_URL: "https://fkifoxniqz.a.pinggy.link/github/scan-callback/?token=9yZCE1o7luvFZzcTYQYtQ2fJa91HZitbR6gJEK3JnoQ"
        run: >
          curl -sS -X POST "$SIEGEPAL_CALLBACK_URL"
          -H "Content-Type: application/json"
          -d '{"repository":"mdespain35/asteroids","run_id":"${{ github.run_id }}","category":"sast"}'
          || true
