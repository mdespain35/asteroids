        id: siegepal_gate
        if: always()
        env:
          SIEGEPAL_GATE_SEVERITY: "high"
          SIEGEPAL_SARIF_FILE: "trivy.sarif"
        run: |
          python3 - <<'PYEOF'
          import json, os
          order = ["none", "low", "medium", "high", "critical"]
          threshold = os.environ.get("SIEGEPAL_GATE_SEVERITY", "none").lower()
          sarif_file = os.environ.get("SIEGEPAL_SARIF_FILE", "")
          out = os.environ.get("GITHUB_OUTPUT")
          def emit(**kw):
              with open(out, "a") as fh:
                  for k, v in kw.items():
                      fh.write("%s=%s\n" % (k, v))
          def sev_from_result(r, rules):
              props = r.get("properties") or {}
              sc = props.get("security-severity")
              if sc is None:
                  rid = r.get("ruleId")
                  rule = rules.get(rid, {})
                  sc = ((rule.get("properties") or {}).get("security-severity"))
              if sc is not None:
                  try:
                      f = float(sc)
                  except (TypeError, ValueError):
                      f = -1
                  if f >= 9.0: return 4
                  if f >= 7.0: return 3
                  if f >= 4.0: return 2
                  if f > 0.0: return 1
              level = (r.get("level") or "").lower()
              return {"error": 3, "warning": 2, "note": 1, "none": 0}.get(level, 2)
